name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive `
            -Path "NC_R9_Production_Manager_MVP_v0_1_GITHUB_READY.zip" `
            -DestinationPath "buildsrc" `
            -Force

      - name: Install PyInstaller
        shell: pwsh
        working-directory: buildsrc/NC_R9_Production_Manager_MVP
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Run tests
        shell: pwsh
        working-directory: buildsrc/NC_R9_Production_Manager_MVP
        run: |
          python tests/run_tests.py

      - name: Build EXE
        shell: pwsh
        working-directory: buildsrc/NC_R9_Production_Manager_MVP
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "NC_R9_Production_Manager" `
            --add-data "data;data" `
            app.py

      - name: Verify EXE
        shell: pwsh
        working-directory: buildsrc/NC_R9_Production_Manager_MVP
        run: |
          if (!(Test-Path "dist/NC_R9_Production_Manager.exe")) {
            throw "EXE not created"
          }
          Get-Item "dist/NC_R9_Production_Manager.exe" |
            Format-List Name,Length,LastWriteTime

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: NC_R9_Production_Manager_Windows
          path: buildsrc/NC_R9_Production_Manager_MVP/dist/NC_R9_Production_Manager.exe
          if-no-files-found: error
